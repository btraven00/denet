name: Documentation

# Builds the Zensical site (zensical.toml, pages in website/) and, on main,
# deploys it to GitHub Pages. Needs Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - website/**
      - docs/**
      - zensical.toml
      - LICENSE
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - website/**
      - docs/**
      - zensical.toml
      - LICENSE
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ZENSICAL: zensical==0.1.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # --strict: a broken link or a missing include fails the build
      - run: pipx run --spec "$ZENSICAL" zensical build --clean --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
