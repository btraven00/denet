name: Conda Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Trusted Publishing: prefix.dev verifies the OIDC token issued by GitHub to
# confirm this workflow is allowed to publish to the channel — no API key needed.
# Configure the trusted publisher once in the prefix.dev channel dashboard:
#   Owner / Repo / Workflow filename: conda-release.yml
permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: denet (${{ matrix.target.platform }})
    runs-on: ${{ matrix.target.os }}
    env:
      CONDA_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && 'edge' || 'almost-conductor' }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: ubuntu-latest,  platform: linux-64  }
          - { os: macos-latest,   platform: osx-arm64 }
          - { os: windows-latest, platform: win-64    }

    steps:
      - uses: actions/checkout@v4

      - name: Set package version (unix)
        if: runner.os != 'Windows'
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "PKG_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            BASE=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
            echo "PKG_VERSION=${BASE}.dev0+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Set package version (windows)
        if: runner.os == 'Windows'
        run: |
          if ("$env:GITHUB_REF_TYPE" -eq "tag") {
            $version = "$env:GITHUB_REF_NAME" -replace '^v', ''
          } else {
            $base = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
            $sha = "$env:GITHUB_SHA".Substring(0, 7)
            $version = "$base.dev0+$sha"
          }
          echo "PKG_VERSION=$version" >> $env:GITHUB_ENV

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build conda package
        uses: prefix-dev/rattler-build-action@v0.2.36
        with:
          recipe-path: conda-recipes/denet/recipe.yaml
          artifact-name: denet-${{ matrix.target.platform }}
          build-args: >-
            --target-platform ${{ matrix.target.platform }}
            --no-test
        env:
          PKG_VERSION: ${{ env.PKG_VERSION }}

      # The recipe's own test would pass on the runner (glibc 2.39) even for a
      # binary that needs 2.39. Install into an old-glibc distro (RHEL/Rocky 8,
      # typical of HPC) before uploading, so that cannot ship again.
      - name: Smoke-test on glibc 2.28 (linux)
        if: matrix.target.platform == 'linux-64'
        run: |
          docker run --rm -v "$PWD/output:/ch:ro" rockylinux:8 bash -c '
            set -e
            dnf -q -y install bzip2 >/dev/null
            curl -fsSL https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xj -C /tmp bin/micromamba
            /tmp/bin/micromamba create -q -y -p /tmp/env -c file:///ch -c conda-forge denet
            /tmp/env/bin/denet --version
            /tmp/env/bin/denet -o /tmp/t.jsonl -q run sh -c "sleep 0.3"
            grep -q "\"kind\":\"metadata\"" /tmp/t.jsonl'

      - name: Upload to prefix.dev (unix)
        if: runner.os != 'Windows'
        run: |
          for file in output/**/*.conda; do
            rattler-build upload prefix \
              --channel "$CONDA_CHANNEL" \
              "$file"
          done

      - name: Upload to prefix.dev (windows)
        if: runner.os == 'Windows'
        run: |
          Get-ChildItem -Recurse output\*.conda | ForEach-Object {
            rattler-build upload prefix --channel "$env:CONDA_CHANNEL" $_.FullName
          }
