[package]
name = "denet"
version = "0.11.2"
default-run = "denet"
edition = "2021"
description = "a streaming process monitor"
license = "GPL-3.0-or-later"
documentation = "https://docs.rs/denet"
homepage = "https://github.com/btraven00/denet"
repository = "https://github.com/btraven00/denet"
readme = "README.md"
keywords = ["profiling", "monitor", "cpu", "resources"]
authors = ["ben <ben.uzh@proton.me>"]

[features]
default = []
python = ["dep:pyo3"]
ebpf = ["dep:aya", "dep:aya-log", "dep:bytes"]
gpu = ["dep:nvml-wrapper", "dep:objc2-core-foundation", "dep:objc2-io-kit"]

[dependencies]
sysinfo = { version = "0.35.2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pyo3 = { version = "0.29", features = [
    "extension-module",
    "auto-initialize",
    "abi3-py39",
], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
ctrlc = "3.4"
crossterm = "0.29"
log = "0.4"
tabled = "0.16"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }

# Add libc for sysconf and procfs for process information on Linux
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
procfs = "0.17"

# eBPF dependencies (optional)
aya = { version = "0.13.1", optional = true }
aya-log = { version = "0.2", optional = true }
bytes = { version = "1.4", optional = true }

# GPU dependencies (optional)
nvml-wrapper = { version = "0.10.0", optional = true }

# Apple Silicon GPU (`gpu` feature on macOS). Both already come in via sysinfo.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFBase", "CFDictionary", "CFData", "CFNumber", "CFString"], optional = true }
objc2-io-kit = { version = "0.3", default-features = false, features = ["std", "libc"], optional = true }

[lib]
# Only build cdylib when python feature is enabled
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "denet"
path = "src/bin/denet.rs"

# Make the ebpf_diag binary only available when the ebpf feature is enabled
[[bin]]
name = "ebpf_diag"
path = "src/bin/ebpf_diag.rs"
required-features = ["ebpf"]

[[example]]
name = "offcpu_basic"
path = "examples/offcpu_basic.rs"
required-features = ["ebpf"]

[dev-dependencies]
once_cell = "1.21"
tempfile = "3.0"

# `cargo deb` (cargo install cargo-deb); scripts/build_deb.sh builds the released one
[package.metadata.deb]
features = ["gpu", "ebpf"]
section = "utils"
extended-description = """\
Tracks CPU, memory, I/O, threads and network bytes of a running process and \
its children, with adaptive sampling and JSON output. Includes NVIDIA GPU \
monitoring (--gpu, needs the NVIDIA driver) and eBPF profiling (--enable-ebpf, \
needs root or CAP_BPF)."""
# only the CLI: ebpf_diag and test_nvml are developer tools
assets = [
    ["target/release/denet", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/denet/", "644"],
    ["docs/denet.1", "usr/share/man/man1/", "644"],
]

# `cargo generate-rpm` (cargo install cargo-generate-rpm); scripts/build_rpm.sh builds the released one
[package.metadata.generate-rpm]
# only the CLI, as in the .deb
assets = [
    { source = "target/release/denet", dest = "/usr/bin/denet", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/denet/README.md", mode = "644", doc = true },
    { source = "docs/denet.1", dest = "/usr/share/man/man1/denet.1", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/denet/LICENSE", mode = "644" },
]
