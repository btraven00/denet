# Documentation site, built with Zensical (https://zensical.org).
# Preview: uvx zensical serve    Build: uvx zensical build
# The pages are in website/. The guides there include files from docs/, which
# stay the source and keep rendering on GitHub.

[project]
site_name = "denet"
site_description = "A streaming process monitor: CPU, memory, I/O, GPU and eBPF metrics of a process and its children"
site_url = "https://btraven00.github.io/denet/"
repo_url = "https://github.com/btraven00/denet"
repo_name = "btraven00/denet"
docs_dir = "website"
site_dir = "site"
nav = [
  { "Home" = "index.md" },
  { "Get started" = "get-started.md" },
  { "Guides" = [
    { "GPU monitoring" = "guides/gpu.md" },
    { "eBPF profiling" = "guides/ebpf.md" },
    { "Portability" = "guides/portability.md" },
  ] },
  { "Advanced topics" = [
    { "Flamegraphs" = "advanced/flamegraphs.md" },
  ] },
  { "License" = "license.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
toc.permalink = true
pymdownx.highlight.anchor_linenums = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
# Lets a page include a file from the repository: --8<-- "docs/gpu.md"
pymdownx.snippets.base_path = "."
pymdownx.snippets.check_paths = true
