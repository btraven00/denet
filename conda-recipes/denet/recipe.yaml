package:
  name: denet
  version: ${{ env.get("PKG_VERSION") | default("0.6.2") }}

source:
  path: ../..

build:
  number: 0
  script:
    - if: linux
      then: bash ${RECIPE_DIR}/build.sh --features gpu
    - if: osx
      then: bash ${RECIPE_DIR}/build.sh
    - if: win
      then: cmd /C %RECIPE_DIR%\build.cmd

requirements:
  build:
    - ${{ compiler('rust') }}
    # Link through conda's GCC against the sysroot glibc pinned in variants.yaml,
    # not the build runner's system glibc (2.39 on ubuntu-latest), which made the
    # binary unusable on anything older than Ubuntu 24.04 (most HPC clusters).
    - if: linux
      then:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - pkg-config

tests:
  - if: not win
    then:
      script:
        interpreter: bash
        content: |
          denet --version
  - if: win
    then:
      script:
        interpreter: cmd
        content: denet --version
